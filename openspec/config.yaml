schema: spec-driven

context: |
  Язык артефактов: русский. Имена API, команд и технические идентификаторы сохраняются в оригинале.
  Профиль проекта описан в .sdd/stack.md; это предпочтения и границы, а не основание добавлять ненужные технологии.
  Отделяй подтверждённые требования от предпочтений, предположений и неизвестных.
  Для внешних контрактов указывай положительные, отрицательные и граничные сценарии.

rules:
  proposal:
    - Опиши цель, измеримый результат, non-goals и затронутые внешние контракты.
    - Раздели обязательные ограничения, предпочтения и предположения.
    - Для необратимых или дорогих решений перечисли жизнеспособные альтернативы и причину выбора.
  specs:
    - Каждое требование должно иметь проверяемые сценарии, включая существенный отрицательный сценарий.
    - Укажи совместимость, миграцию и rollback, если меняются данные или публичный контракт.
  design:
    - Зафиксируй границы domain, transport, persistence и UI, а также направление зависимостей.
    - Объясни модель ошибок, транзакционные границы и стратегию наблюдаемости, если они затронуты.
  tasks:
    - Свяжи реализацию и тесты с требованиями; не создавай задачи, не нужные для принятого scope.
    - Включи релевантные unit, integration, contract и UI проверки.

operations:
  apply:
    guidance:
      - Не расширяй scope молча; расхождение со спецификацией сначала отрази в change-артефактах.
      - Отмечай задачу выполненной только после реализации и относящейся к ней проверки.
      - Сохраняй несвязанные изменения пользователя.
  archive:
    guidance:
      - Перед архивированием выполни строгую OpenSpec validation и project quality gate.
      - Кратко перечисли фактические проверки и оставшиеся ограничения.
