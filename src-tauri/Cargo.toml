[package]
name = "xp-capture"
version = "0.1.0"
description = "XP Capture OpenCV runtime diagnostics"
authors = ["XP Capture contributors"]
default-run = "xp-capture"
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "xp_capture_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "xp-capture"
path = "src/main.rs"

[[bin]]
name = "camera-mode-profile-smoke"
path = "src/bin/camera-mode-profile-smoke.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
opencv = { version = "=0.100.1", default-features = false, features = ["clang-runtime", "imgcodecs", "imgproc", "videoio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
